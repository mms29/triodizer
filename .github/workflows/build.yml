name: TubeLab Plugin CI/CD

on:
  push:
  pull_request:
  release:
    types: [created]

jobs:
  macos-build:
    name: macOS Build (VST3 / AU / Standalone)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja ccache

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build plugin
        run: |
          cmake --build build -j

      - name: Locate built plugins
        run: |
          echo "Searching for built plugin artifacts..."
          find build -type f \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TubeLab-macOS-build
          path: |
            build/**/*.vst3
            build/**/*.component
            build/**/*.app

  windows-build:
    name: Windows Build (VST3 / Standalone)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: |
          choco install cmake ninja sccache -y

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build plugin
        run: |
          cmake --build build --config Release

      - name: Locate built plugins
        run: |
          echo "Searching for built plugin artifacts..."
          Get-ChildItem -Path build -Recurse -Include "*.vst3","*.exe" -ErrorAction SilentlyContinue

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TubeLab-Windows-build
          path: |
            build/**/*.vst3
            build/**/*.exe

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos-build, windows-build]
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: TubeLab-macOS-build

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: TubeLab-Windows-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TubeLab-macOS-build/**/*.vst3
            TubeLab-macOS-build/**/*.component
            TubeLab-macOS-build/**/*.app
            TubeLab-Windows-build/**/*.vst3
            TubeLab-Windows-build/**/*.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
